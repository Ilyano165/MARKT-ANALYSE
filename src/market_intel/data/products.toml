# Yellotools-Produktmatrix – Ausgangspunkt der Kundensuche (Phase 4).
#
# Stand 2026-10-20. Grundlage: öffentliche Yellotools-Produktseiten und -Kategorien, ermittelt
# über eine Websuche (die Seiten selbst waren aus der Entwicklungsumgebung nicht abrufbar).
# Status je Produktgruppe:
#   "researched"  = Funktionen/Grenzen aus Herstellerangaben zusammengefasst, vom Vertrieb NICHT bestätigt
#   "confirmed"   = vom Yellotools-Produktmanagement/Vertrieb bestätigt (Feld confirmed_by/at setzen)
# Pflege: Datei kopieren, ändern, mit `mi products validate datei.toml` prüfen und per
# `products_file = "…"` in market_intel.toml aktivieren; oder `mi products import tabelle.csv`.
#
# Felder je Produktgruppe:
#   key, name, description, examples (Produktnamen), materials, processes, typical_users,
#   alternative_users (Hypothesen!), applications (Schlüssel aus use_cases.toml),
#   industries, limitations (bekannte technische Einschränkungen), sources (URL + Inhalt),
#   process_terms (Begriffe, die auf Unternehmensseiten den Arbeitsprozess belegen)

[meta]
version = "2026-10-20"
manufacturer = "Yellotools GmbH, Windeck (laut Herstellerseite)"
manufacturer_target_groups = ["Werbetechniker", "Fahrzeugfolierer", "Digitaldrucker", "Display- und Beschilderungsspezialisten"]
manufacturer_source = "https://www.yellotools.com/en/Shop-Service/Company/"
catalog_source = "https://www.yellotools.com/Catalog/YTKatalog_01-2022_EN.pdf"
note = "Produktangaben sind Herstellerangaben; Eignung für alternative Anwender ist eine Hypothese."

# Erwähnungen dieser Marken/Werkzeuge auf Unternehmensseiten sind nur ein HINWEIS auf vorhandene
# Werkzeuge oder alternative Lieferanten – keine belegte Lieferbeziehung.
[tool_mentions]
own_brand = ["Yellotools", "YelloBlade", "WrapStick", "BodyGuardKnife", "EdgeWrap", "WallRoller", "WrapGun"]
other_brands = ["Knifeless Tape", "Olfa", "NT Cutter", "3M Hand Applicator", "Avery Dennison Squeegee", "GT Tools", "Fusion Tools"]


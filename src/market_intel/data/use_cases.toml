# Anwendungsfälle für Customer Discovery – STARTHYPOTHESEN, nicht belegt.
# Status "hypothesis": vom Yellotools-Vertrieb zu bestätigen oder zu verwerfen.
# Produktkategorien: Arbeitsnamen aus dem öffentlichen Shop (Schneiden, Rakel, Entfernen,
# Messen, Car-Wrapping-Hilfsmittel); Ersatz durch den echten Artikelstamm in Meilenstein M10.
#
# Felder:
#   website_terms   Begriffe, die auf der eigenen Webseite eines Unternehmens den Anwendungsfall belegen
#   name_terms      Begriffe in Firmennamen (GLEIF-Namenssuche)
#   tender_terms    Volltextbegriffe für EU-Ausschreibungen (TED)
#   news_terms      Begriffe für die Nachrichtensuche (GDELT)
#   industry_terms  Suchbegriffe, um Wikidata-Branchen zu finden (Zuordnung wird protokolliert)

[[use_case]]
key = "fahrzeugfolierung"
name = "Fahrzeugbeschriftung und Car Wrapping"
evidence_status = "hypothesis"
product_categories = ["Rakel", "Schneidwerkzeuge", "Car-Wrapping-Hilfsmittel", "Entfernen"]
website_terms = ["Fahrzeugfolierung", "Fahrzeugbeschriftung", "Car Wrapping", "Vollfolierung", "Teilfolierung", "Autofolierung", "Flottenbeschriftung", "vehicle wrap"]
name_terms = ["Fahrzeugfolierung", "Folierung", "Car Wrapping", "Werbetechnik"]
tender_terms = ["Fahrzeugbeschriftung", "Folierung"]
news_terms = ["Fahrzeugfolierung"]
industry_terms = ["Werbetechnik", "sign industry"]


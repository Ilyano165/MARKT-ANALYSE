# Anwendungs- und Branchenmatrix für Customer Discovery (Phase 4).
#
# Jeder Eintrag verbindet eine Branche/Tätigkeit mit konkreten Yellotools-Produktgruppen
# (Schlüssel aus products.toml) und Arbeitsprozessen. ALLE Einträge sind SUCHHYPOTHESEN:
#   evidence_status = "hypothesis"  – fachlich plausibel abgeleitet, vom Vertrieb nicht bestätigt
#   evidence_status = "confirmed"   – vom Yellotools-Vertrieb bestätigt (Kunden vorhanden)
#   evidence_status = "rejected"    – geprüft und verworfen (bleibt zur Dokumentation stehen)
# origin: "auftrag" (Branchenliste der Anforderung) oder "abgeleitet" (aus dem Portfolio ergänzt)
#
# Felder:
#   product_groups   Produktgruppen aus products.toml
#   processes        Arbeitsprozesse, bei denen die Werkzeuge helfen könnten
#   rationale        Warum ein Bedarf plausibel sein könnte (Hypothese, kein Beleg)
#   counter_indicators  was gegen einen Bedarf sprechen kann
#   counter_terms    Begriffe, deren Vorkommen GEGEN die Rolle als Anwender spricht (z. B. Folienhersteller
#                    statt Folierbetrieb); Treffer werden mit Zitat gezeigt und senken die Tätigkeitsbewertung
#   website_terms    Begriffe, die auf der eigenen Webseite/den Dokumenten eines Unternehmens die
#                    Tätigkeit belegen (Grundlage des Produkt-Fits; spezifisch halten!)
#   name_terms / tender_terms / news_terms / industry_terms  Suchbegriffe je Quelle


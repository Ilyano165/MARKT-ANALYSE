# Baut und prüft die Windows-Anwendung auf einem echten Windows-Rechner (GitHub Actions):
# Tests → PyInstaller-Paket → Rauchtest → NSIS-Installer → Installieren/Testen/Deinstallieren.
# Ergebnis: Artefakt „MarketIntel-Setup“ (unsignierte Setup.exe).
name: Windows-Build und Installer

on:
  push:
    branches: ["main", "claude/confident-faraday-0tsww5"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: python -m pip install -e ".[dev,desktop]" "pyinstaller==6.16.0"

      - name: Chromium für Browser-Tests (Playwright)
        run: python -m playwright install chromium

      - name: Tests unter Windows
        timeout-minutes: 20
        # faulthandler: hängt ein Test > 5 min, werden alle Thread-Stapel ausgegeben
        run: python -m pytest -rs -o faulthandler_timeout=300 --durations=15

      - name: Anwendung paketieren (PyInstaller)
        run: python -m PyInstaller installer/MarketIntel.spec --noconfirm

      - name: Rauchtest des Pakets
        shell: pwsh
        run: ./installer/smoke-test.ps1 -Exe dist/MarketIntel/MarketIntel.exe

      - name: NSIS bereitstellen (zlib-Lizenz, kostenlos auch kommerziell)
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { choco install nsis --no-progress -y }
          if (-not (Test-Path $makensis)) { throw "makensis.exe nicht gefunden" }

      - name: Installer bauen (NSIS)
        shell: pwsh
        run: |
          $version = python -c "import market_intel; print(market_intel.__version__)"
          New-Item -ItemType Directory -Force dist-installer | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DVERSION=$version" installer/MarketIntel.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis fehlgeschlagen" }

      - name: Installieren, testen, deinstallieren
        shell: pwsh
        run: ./installer/install-test.ps1

      - name: Lebenszyklus (Verknüpfung, Datenerhalt, Überinstallation, Neuinstallation)
        shell: pwsh
        run: ./installer/lifecycle-test.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: MarketIntel-Setup
          path: dist-installer/*.exe
          retention-days: 30
